name: Self improve frontier tournament

on:
  workflow_dispatch:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_frontier_tournament.py'
      - '.github/workflows/self-improve-frontier-tournament.yml'

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Run staged tournament
        run: uv run python tools/self_improve_frontier_tournament.py
      - uses: actions/upload-artifact@v4
        with:
          name: self-improve-frontier-result
          path: tournament-result.json
