name: Apply self-improvement winner

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_tournament.py
      - .github/workflows/self-improve-tournament.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: self-improve
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Sync
        run: uv sync --extra dev
      - name: Apply winner
        run: uv run python tools/self_improve_tournament.py
      - name: Run tests
        run: uv run pytest -q
      - name: Commit winner
        run: |
          git config user.name "MinoFlux self-improve"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Adopt garbage slot supply floor" || exit 0
          git pull --rebase origin self-improve
          git push origin HEAD:self-improve
