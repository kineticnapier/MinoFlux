name: Self-improve tournament

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_tournament.py
      - .github/workflows/self-improve-tournament.yml

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python tools/self_improve_tournament.py
