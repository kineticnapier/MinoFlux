name: Self improvement tournament

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_round.py
      - .github/workflows/self-improve-tournament.yml

jobs:
  versus:
    name: versus (${{ matrix.candidate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate:
          - emergency_slot_liquidation
          - pending_height_coupling
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package
        run: uv sync --extra game --extra dev
      - name: Evaluate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          STAGE: versus
        run: uv run --no-sync python tools/self_improve_round.py
