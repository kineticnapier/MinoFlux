name: Self improve tournament

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_tournament.py
      - .github/workflows/self-improve-tournament.yml

jobs:
  short:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - deep_hole_tail_recovery
          - hole_depth_per_hole
          - clean_clear_compaction
          - low_damage_attack
          - danger_deep_hole_escape
          - danger_smooth_escape
          - t_near_damage_avoidance
          - t_near_clean_conversion_margin
          - slot_vs_deep_hole_tradeoff
          - safe_slot_reserve
          - clean_surface_recovery
          - nonlinear_damage_guard
          - high_stack_clean_attack
          - spin_exit_quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra game
      - name: Evaluate candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          STAGE: short
        run: uv run python tools/self_improve_tournament.py
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.candidate }}
          path: result.json
