name: Self improve tournament

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_tournament.py
      - .github/workflows/self-improve-tournament.yml
  workflow_dispatch:

jobs:
  versus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run python tools/self_improve_tournament.py --candidate t_near_garbage_recovery --stage versus --output results/t_near_garbage_recovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: versus-t_near_garbage_recovery
          path: results/t_near_garbage_recovery.json
