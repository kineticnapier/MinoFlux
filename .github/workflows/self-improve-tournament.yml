name: Self Improve Tournament
on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_tournament.py'
      - '.github/workflows/self-improve-tournament.yml'
  workflow_dispatch:

jobs:
  versus-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python tools/self_improve_tournament.py --candidate combo_continue --mode versus --games 4 --turns 80 --seed-base 44001 --seed-step 313
