name: Self improve tournament

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_tournament.py
      - .github/workflows/self-improve-tournament.yml

jobs:
  fresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - t_arrival_clean_conversion
          - b2b_tspin_conversion
          - downstack_hole_recovery
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra game
      - name: Evaluate candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          STAGE: fresh
        run: uv run python tools/self_improve_tournament.py
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-${{ matrix.candidate }}
          path: result.json
