name: Self-improvement tournament

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_tournament.py
      - .github/workflows/self-improve-tournament.yml
      - src/minoflux_ai/**
      - src/minoflux_engine/**

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -e .
      - name: Run tournament
        run: python tools/self_improve_tournament.py
