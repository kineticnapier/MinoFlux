name: Self improve tournament

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_tournament.py
      - .github/workflows/self-improve-tournament.yml

jobs:
  versus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - slot_vs_deep_hole_tradeoff
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra game
      - name: Evaluate candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          STAGE: versus
        run: uv run python tools/self_improve_tournament.py
      - uses: actions/upload-artifact@v4
        with:
          name: versus-${{ matrix.candidate }}
          path: result.json
