name: Robust garbage tournament
on:
  push:
    branches: [self-improve]
    paths:
      - tools/robust_garbage_tournament.py
      - .github/workflows/robust-garbage-tournament.yml
permissions:
  contents: read
  pull-requests: write
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Run tournament
        run: uv run python tools/robust_garbage_tournament.py | tee tournament.json
      - name: Report to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Robust garbage tournament result'
            echo '```json'
            cat tournament.json
            echo '```'
          } > report.md
          gh pr comment 2 --body-file report.md
