name: Temporary Neural Search Phase1 Profile

on:
  push:
    branches:
      - perf/neural-search-phase1-20260907

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --extra ml
      - name: Native focused tests
        run: uv run --no-sync python -m pytest -q tests/test_neural_native_record_path.py tests/test_neural_native_record_profile.py tests/test_neural_native_encoding.py tests/test_reachability_native.py
      - name: Phase 1 profile
        run: uv run --no-sync python tools/_tmp_neural_search_phase1_profile.py
