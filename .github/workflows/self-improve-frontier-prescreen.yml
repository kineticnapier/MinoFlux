name: Self improve frontier prescreen

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_frontier_prescreen.py'
      - '.github/workflows/self-improve-frontier-prescreen.yml'

jobs:
  prescreen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Run prescreen
        working-directory: tools
        run: uv run python self_improve_frontier_prescreen.py
      - uses: actions/upload-artifact@v4
        with:
          name: self-improve-frontier-prescreen-result
          path: tools/tournament-prescreen.json
