name: Strategic feature sweep

on:
  push:
    branches: [self-improve]

concurrency:
  group: strategic-feature-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: strategic (${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - tspin
          - b2b
          - downstack
          - combined
          - combined-strong
    runs-on: ubuntu-latest
    env:
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package
        run: uv sync --extra dev
      - name: Run fixed and unseen strength screen
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from dataclasses import replace
          from time import perf_counter

          from minoflux_ai.benchmark import run_heuristic_benchmark
          from minoflux_ai.heuristic import DEFAULT_WEIGHTS
          from minoflux_ai.search import DEFAULT_SEARCH_CONFIG

          name = os.environ["CANDIDATE"]
          weights = DEFAULT_WEIGHTS
          if name == "tspin":
              weights = replace(weights, t_spin_slots=0.60)
          elif name == "b2b":
              weights = replace(weights, b2b_extend=1.20, b2b_break=-2.50)
          elif name == "downstack":
              weights = replace(weights, downstack_cost=-0.025)
          elif name == "combined":
              weights = replace(
                  weights,
                  t_spin_slots=0.45,
                  b2b_extend=0.90,
                  b2b_break=-2.00,
                  downstack_cost=-0.020,
              )
          elif name == "combined-strong":
              weights = replace(
                  weights,
                  t_spin_slots=0.80,
                  b2b_extend=1.50,
                  b2b_break=-3.50,
                  downstack_cost=-0.040,
              )

          for case, seed_base, seed_step in (
              ("fixed", 104729, 7919),
              ("unseen", 982451653, 104729),
          ):
              started = perf_counter()
              result = run_heuristic_benchmark(
                  games=4,
                  max_pieces=120,
                  seed_base=seed_base,
                  seed_step=seed_step,
                  weights=weights,
                  search_config=DEFAULT_SEARCH_CONFIG,
                  workers=4,
              )
              elapsed = perf_counter() - started
              app = result.attack / result.pieces if result.pieces else 0.0
              print(
                  f"RESULT case={case} candidate={name} pieces={result.pieces} "
                  f"attack={result.attack} app={app:.6f} topouts={result.topouts} "
                  f"completed={result.completed}/{result.games} lines={result.lines} "
                  f"spins={result.spins} spin_lines={result.spin_lines} "
                  f"tmini={result.t_spin_minis} tms={result.t_spin_mini_singles} "
                  f"tss={result.t_spin_singles} tsd={result.t_spin_doubles} "
                  f"tst={result.t_spin_triples} pc={result.perfect_clears} "
                  f"elapsed={elapsed:.3f}"
              )
          PY
