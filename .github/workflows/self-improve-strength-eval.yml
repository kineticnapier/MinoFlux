name: Self-improve strength eval

on:
  push:
    branches: [self-improve]

concurrency:
  group: self-improve-strength-eval
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package
        run: uv sync --extra dev
      - name: Compare baseline and attack-weight candidate
        run: |
          uv run --no-sync python - <<'PY'
          from dataclasses import replace
          from minoflux_ai.benchmark import run_heuristic_benchmark
          from minoflux_ai.heuristic import DEFAULT_WEIGHTS
          from minoflux_ai.search import DEFAULT_SEARCH_CONFIG

          def metrics(label, result):
              attack_per_piece = result.attack / result.pieces if result.pieces else 0.0
              print(
                  f"RESULT {label} pieces={result.pieces} attack={result.attack} "
                  f"attack_per_piece={attack_per_piece:.6f} topouts={result.topouts} "
                  f"completed={result.completed}/{result.games} spins={result.spins} "
                  f"spin_lines={result.spin_lines} tsd={result.t_spin_doubles} "
                  f"tst={result.t_spin_triples}"
              )

          baseline = DEFAULT_WEIGHTS
          candidate = replace(DEFAULT_WEIGHTS, attack=1.10)
          cfg = DEFAULT_SEARCH_CONFIG
          cases = (
              ("fixed", 104729, 7919),
              ("unseen", 982451653, 104729),
          )
          for name, seed_base, seed_step in cases:
              for kind, weights in (("baseline", baseline), ("candidate", candidate)):
                  result = run_heuristic_benchmark(
                      games=2,
                      max_pieces=60,
                      seed_base=seed_base,
                      seed_step=seed_step,
                      weights=weights,
                      search_config=cfg,
                      workers=2,
                  )
                  metrics(f"{name}-{kind}", result)
          PY
