name: Native Reachability Prototype

on:
  push:
    branches: [perf-native-pathless-srs-20260905]

jobs:
  prototype:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build package with optional native extension
        run: uv sync --extra game --extra dev
      - name: Verify native extension loads
        run: uv run --no-sync python -c "from minoflux_ai.reachability_native import native_pathless_available; assert native_pathless_available(); print('native reachability loaded')"
      - name: Run existing tests
        run: uv run --no-sync python -m pytest -q
