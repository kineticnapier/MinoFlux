name: Strength tournament runtime
on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/strength_tournament_runtime.py'
      - 'src/minoflux_ai/heuristic.py'
      - '.github/workflows/strength-tournament-runtime.yml'
jobs:
  fresh:
    strategy:
      fail-fast: false
      matrix:
        candidate: [baseline, setup_preserve_attack, well_danger, spin_clear_efficiency]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Run fresh candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          PHASE: fresh
        run: python tools/strength_tournament_runtime.py
