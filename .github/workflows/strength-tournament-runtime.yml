name: Strength tournament runtime

on:
  push:
    branches: [self-improve]
    paths:
      - tools/strength_tournament_runtime.py
      - .github/workflows/strength-tournament-runtime.yml

jobs:
  fresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - slot_height_quality
          - slot_delta_clean
          - slot_delta_holefree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Run fresh candidate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          PHASE: fresh
        run: python tools/strength_tournament_runtime.py
