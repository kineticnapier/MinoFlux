name: Strength tournament runtime
on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/strength_tournament_runtime.py'
jobs:
  versus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Run mirrored versus finalist
        env:
          CANDIDATE: well_danger
          PHASE: versus
        run: python tools/strength_tournament_runtime.py
