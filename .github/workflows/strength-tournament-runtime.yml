name: Strength tournament runtime
on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/strength_tournament_runtime.py'
      - '.github/workflows/strength-tournament-runtime.yml'
      - 'src/minoflux_ai/heuristic.py'
jobs:
  versus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Run mirrored versus final
        env:
          CANDIDATE: b2b_start_value
          PHASE: versus
        run: python tools/strength_tournament_runtime.py
