name: Self-improve strength validation

on:
  push:
    branches: [self-improve]

concurrency:
  group: self-improve-strength-sweep
  cancel-in-progress: true

jobs:
  solo:
    name: solo (${{ matrix.candidate }})
    strategy:
      fail-fast: false
      matrix:
        candidate: [baseline, survival-heavy]
    runs-on: ubuntu-latest
    env:
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package
        run: uv sync --extra dev
      - name: Run longer solo validation
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from dataclasses import replace
          from minoflux_ai.benchmark import run_heuristic_benchmark
          from minoflux_ai.heuristic import DEFAULT_WEIGHTS
          from minoflux_ai.search import DEFAULT_SEARCH_CONFIG

          name = os.environ["CANDIDATE"]
          weights = DEFAULT_WEIGHTS
          if name == "survival-heavy":
              weights = replace(DEFAULT_WEIGHTS, max_height=-0.35, holes=-1.00, new_holes=-1.60)

          for case, seed_base, seed_step in (
              ("fixed", 104729, 7919),
              ("unseen", 982451653, 104729),
          ):
              result = run_heuristic_benchmark(
                  games=4,
                  max_pieces=120,
                  seed_base=seed_base,
                  seed_step=seed_step,
                  weights=weights,
                  search_config=DEFAULT_SEARCH_CONFIG,
                  workers=4,
              )
              app = result.attack / result.pieces if result.pieces else 0.0
              print(
                  f"RESULT case={case} candidate={name} pieces={result.pieces} "
                  f"attack={result.attack} app={app:.6f} topouts={result.topouts} "
                  f"completed={result.completed}/{result.games} lines={result.lines} "
                  f"spins={result.spins} spin_lines={result.spin_lines} "
                  f"tmini={result.t_spin_minis} tms={result.t_spin_mini_singles} "
                  f"tss={result.t_spin_singles} tsd={result.t_spin_doubles} "
                  f"tst={result.t_spin_triples} pc={result.perfect_clears}"
              )
          PY

  versus:
    name: survival-heavy versus baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package
        run: uv sync --extra dev
      - name: Run mirrored versus validation
        run: |
          uv run --no-sync python - <<'PY'
          from dataclasses import replace
          from minoflux_ai.heuristic import DEFAULT_WEIGHTS
          from minoflux_ai.versus_benchmark import run_versus_benchmark
          from minoflux_ai.versus_search import DEFAULT_VERSUS_SEARCH_CONFIG

          candidate = replace(DEFAULT_WEIGHTS, max_height=-0.35, holes=-1.00, new_holes=-1.60)
          cfg = replace(DEFAULT_VERSUS_SEARCH_CONFIG, candidate_width=4, opponent_reply_width=1)
          result = run_versus_benchmark(
              games=4,
              max_turns=40,
              seed_base=314159,
              seed_step=271828,
              player_weights=candidate,
              ai_weights=DEFAULT_WEIGHTS,
              player_config=cfg,
              ai_config=cfg,
          )
          print(
              f"VERSUS candidate_wins={result.player_wins} baseline_wins={result.ai_wins} "
              f"draws={result.draws} candidate_attack={result.player_mean_attack:.3f} "
              f"baseline_attack={result.ai_mean_attack:.3f} "
              f"candidate_sent={result.player_mean_sent:.3f} baseline_sent={result.ai_mean_sent:.3f}"
          )
          for game in result.per_game:
              print("GAME", game)
          PY
