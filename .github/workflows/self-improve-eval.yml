name: Self Improve Eval

on:
  push:
    branches: [self-improve]
    paths:
      - 'src/minoflux_ai/search.py'
      - '.github/workflows/self-improve-eval.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e .
      - name: Compare discount 0.90 vs 0.95
        run: |
          python - <<'PY'
          from pathlib import Path
          from minoflux_ai.benchmark import run_heuristic_benchmark
          from minoflux_ai.search import SearchConfig

          def measure(discount):
              totals = dict(pieces=0, attack=0, topouts=0, completed=0, spins=0, spin_lines=0, tsd=0, tst=0)
              groups = []
              for base in (17, 1009, 9001):
                  r = run_heuristic_benchmark(
                      games=2,
                      max_pieces=100,
                      seed_base=base,
                      seed_step=31,
                      search_config=SearchConfig(discount=discount),
                      workers=2,
                  )
                  groups.append(r.attack / r.pieces if r.pieces else 0.0)
                  totals['pieces'] += r.pieces
                  totals['attack'] += r.attack
                  totals['topouts'] += r.topouts
                  totals['completed'] += r.completed
                  totals['spins'] += r.spins
                  totals['spin_lines'] += r.spin_lines
                  totals['tsd'] += r.t_spin_doubles
                  totals['tst'] += r.t_spin_triples
              totals['app'] = totals['attack'] / totals['pieces'] if totals['pieces'] else 0.0
              return totals, groups

          lines = []
          for label, discount in [('baseline', 0.90), ('candidate', 0.95)]:
              t, groups = measure(discount)
              msg = (
                  f"{label}: discount={discount}, app={t['app']:.6f}, attack={t['attack']}, "
                  f"pieces={t['pieces']}, topouts={t['topouts']}/6, completed={t['completed']}/6, "
                  f"spins={t['spins']}, spin_lines={t['spin_lines']}, TSD={t['tsd']}, TST={t['tst']}, "
                  f"group_app={','.join(f'{x:.6f}' for x in groups)}"
              )
              lines.append(msg)
              print(msg)
          Path('.self-improve-eval.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Publish evaluation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .self-improve-eval.txt
          git commit -m "Record temporary discount evaluation" || exit 0
          git push
