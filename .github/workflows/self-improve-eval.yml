name: Self Improve Eval

on:
  push:
    branches: [self-improve]
    paths:
      - '.github/workflows/self-improve-eval.yml'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e .
      - name: Compare baseline and stronger new-hole penalty
        run: |
          python - <<'PY' | tee eval.txt
          from dataclasses import replace
          from minoflux_ai.benchmark import run_heuristic_benchmark
          from minoflux_ai.heuristic import DEFAULT_WEIGHTS

          candidate = replace(DEFAULT_WEIGHTS, new_holes=-1.30)
          groups = [(11,31), (1009,37), (9001,43)]
          for name, weights in [('baseline', DEFAULT_WEIGHTS), ('candidate', candidate)]:
              total_pieces=total_attack=total_spins=total_spin_lines=0
              total_tsd=total_tst=total_topouts=total_completed=0
              print(name)
              for base, step in groups:
                  r = run_heuristic_benchmark(games=4, max_pieces=150, seed_base=base, seed_step=step, weights=weights, workers=4)
                  app = r.attack / r.pieces if r.pieces else 0.0
                  print(f'group base={base} step={step}: pieces={r.pieces} attack={r.attack} app={app:.6f} topouts={r.topouts} completed={r.completed} spins={r.spins} spin_lines={r.spin_lines} tsd={r.t_spin_doubles} tst={r.t_spin_triples}')
                  total_pieces += r.pieces; total_attack += r.attack; total_spins += r.spins; total_spin_lines += r.spin_lines
                  total_tsd += r.t_spin_doubles; total_tst += r.t_spin_triples; total_topouts += r.topouts; total_completed += r.completed
              print(f'TOTAL pieces={total_pieces} attack={total_attack} app={total_attack/total_pieces:.6f} topouts={total_topouts} completed={total_completed} spins={total_spins} spin_lines={total_spin_lines} tsd={total_tsd} tst={total_tst}')
          PY
          {
            echo '### Strength evaluation'
            echo '```text'
            cat eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
