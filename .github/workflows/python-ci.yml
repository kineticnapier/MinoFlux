name: Python CI

on:
  push:
    branches:
      - main
      - self-improve
  pull_request:
    branches:
      - main
    types: [opened, reopened, ready_for_review]

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-test:
    name: fast-test (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync package and game dependencies
        run: uv sync --extra game --extra dev
      - name: Run tests
        run: uv run --no-sync python -m pytest -q
      - name: Verify pygame-ce import
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python -c "import pygame; print(pygame.version.ver)"
      - name: Run headless smoke simulation
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python -m minoflux smoke --games 1 --max-pieces 20
      - name: Import Pygame clients and capture tools
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python -c "from minoflux.replay import build_parser as replay_parser; from minoflux.versus_ai import build_parser as versus_parser; from minoflux_ai import load_tetrio_capture, align_capture_samples; print(replay_parser().prog, versus_parser().prog)"

  tournament-versus:
    if: github.event_name == 'push' && github.ref == 'refs/heads/self-improve'
    name: mirrored versus (t_queue_exact_match)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package
        run: uv sync --extra game --extra dev
      - name: Mirrored versus validation
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from dataclasses import replace
          from minoflux_ai import heuristic
          from minoflux_ai.versus_benchmark import run_versus_benchmark

          original_context = heuristic._context_score
          candidate_weights = replace(heuristic.DEFAULT_WEIGHTS)

          def candidate_context(game, f):
              slots = f.board.t_spin_slots
              supply = (1 if game.current == 'T' else 0) + sum(1 for p in list(game.queue)[:6] if p == 'T') + (1 if game.hold_piece == 'T' else 0)
              return 0.24 * min(slots, supply) - 0.22 * abs(slots - supply)

          def patched_context(game, f, w):
              base = original_context(game, f, w)
              if w is candidate_weights:
                  return base + candidate_context(game, f)
              return base

          heuristic._context_score = patched_context
          result = run_versus_benchmark(
              games=6,
              max_turns=100,
              seed_base=82411,
              seed_step=37,
              player_weights=candidate_weights,
              ai_weights=heuristic.DEFAULT_WEIGHTS,
          )
          games = result.per_game
          out = {
              'games': result.games,
              'candidate_wins': result.player_wins,
              'baseline_wins': result.ai_wins,
              'draws': result.draws,
              'candidate_attack': sum(g.player_attack for g in games) / len(games),
              'baseline_attack': sum(g.ai_attack for g in games) / len(games),
              'candidate_sent': sum(g.player_sent for g in games) / len(games),
              'baseline_sent': sum(g.ai_sent for g in games) / len(games),
              'candidate_canceled': sum(g.player_canceled for g in games) / len(games),
              'baseline_canceled': sum(g.ai_canceled for g in games) / len(games),
              'candidate_received': sum(g.player_received for g in games) / len(games),
              'baseline_received': sum(g.ai_received for g in games) / len(games),
              'candidate_max_b2b': sum(g.player_max_b2b for g in games) / len(games),
              'baseline_max_b2b': sum(g.ai_max_b2b for g in games) / len(games),
              'candidate_topouts': sum(g.winner == 'ai' for g in games),
              'baseline_topouts': sum(g.winner == 'player' for g in games),
          }
          print('VERSUS_RESULT=' + json.dumps(out, sort_keys=True))
          PY

  full-validation:
    name: full-validation (3.13)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package and game dependencies
        run: uv sync --extra game --extra dev
      - name: Run parallel Attack/Spin benchmark and replay fixture
        run: uv run --no-sync python -m minoflux benchmark --games 2 --max-pieces 8 --workers 2 --fitness-profile attack_spin --hold --lookahead-pieces 1 --beam-width 2 --replay-out data/replays/ci-benchmark.json
      - name: Run tiny opponent-aware versus benchmark
        run: uv run --no-sync python -m minoflux versus-benchmark --games 1 --max-turns 4 --candidate-width 2 --reply-width 0 --no-hold --lookahead-pieces 0 --beam-width 1
      - name: Run parallel Hold-aware CEM fixture without promotion benchmark
        run: uv run --no-sync python -m minoflux train-cem --generations 1 --population 4 --games 1 --max-pieces 8 --validation-games 1 --workers 2 --screen-games 1 --screen-max-pieces 4 --screen-fraction 0.5 --fitness-profile attack_spin --hold --lookahead-pieces 0 --beam-width 2 --no-promote --model-out data/models/ci-cem.json --replay-out data/replays/ci-cem.json
