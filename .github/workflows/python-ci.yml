name: Python CI

on:
  push:
    branches:
      - main
      - self-improve
  pull_request:
    branches:
      - main
    types: [opened, reopened, ready_for_review]

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-test:
    name: fast-test (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync package and game dependencies
        run: uv sync --extra game --extra dev
      - name: Run tests
        run: uv run --no-sync python -m pytest -q
      - name: Verify pygame-ce import
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python -c "import pygame; print(pygame.version.ver)"
      - name: Run headless smoke simulation
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python -m minoflux smoke --games 1 --max-pieces 20
      - name: Import Pygame clients and capture tools
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python -c "from minoflux.replay import build_parser as replay_parser; from minoflux.versus_ai import build_parser as versus_parser; from minoflux_ai import load_tetrio_capture, align_capture_samples; print(replay_parser().prog, versus_parser().prog)"

  self-improve-eval:
    name: self-improve reachability evaluation
    if: github.event_name == 'push' && github.ref == 'refs/heads/self-improve'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package and dev dependencies
        run: uv sync --extra dev
      - name: Compare reachability node limits
        run: |
          uv run --no-sync python - <<'PY'
          import json
          import time
          from minoflux_ai import SearchConfig, load_weights, run_heuristic_benchmark

          weights = load_weights('presets/recovered-attack-20260723.json')
          cases = [('fixed', 1), ('unseen', 1009)]
          for label, seed in cases:
              for limit in (8000, 4000):
                  cfg = SearchConfig(allow_hold=True, lookahead_pieces=1, beam_width=4, discount=0.90, reachability_node_limit=limit)
                  start = time.perf_counter()
                  result = run_heuristic_benchmark(games=4, max_pieces=80, seed_base=seed, seed_step=31, weights=weights, search_config=cfg, workers=2)
                  elapsed = time.perf_counter() - start
                  payload = {
                      'case': label,
                      'nodeLimit': limit,
                      'elapsedSec': round(elapsed, 3),
                      'attack': result.attack,
                      'attackPerPiece': round(result.attack / max(1, result.pieces), 6),
                      'pieces': result.pieces,
                      'topouts': result.topouts,
                      'spinLines': result.spin_lines,
                      'tSpinDoubles': result.t_spin_doubles,
                      'tSpinTriples': result.t_spin_triples,
                      'completed': result.completed,
                  }
                  print('SELF_IMPROVE_EVAL ' + json.dumps(payload, sort_keys=True))
          PY

  full-validation:
    name: full-validation (3.13)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package and game dependencies
        run: uv sync --extra game --extra dev
      - name: Run parallel Attack/Spin benchmark and replay fixture
        run: uv run --no-sync python -m minoflux benchmark --games 2 --max-pieces 8 --workers 2 --fitness-profile attack_spin --hold --lookahead-pieces 1 --beam-width 2 --replay-out data/replays/ci-benchmark.json
      - name: Run tiny opponent-aware versus benchmark
        run: uv run --no-sync python -m minoflux versus-benchmark --games 1 --max-turns 4 --candidate-width 2 --reply-width 0 --no-hold --lookahead-pieces 0 --beam-width 1
      - name: Run parallel Hold-aware CEM fixture without promotion benchmark
        run: uv run --no-sync python -m minoflux train-cem --generations 1 --population 4 --games 1 --max-pieces 8 --validation-games 1 --workers 2 --screen-games 1 --screen-max-pieces 4 --screen-fraction 0.5 --fitness-profile attack_spin --hold --lookahead-pieces 0 --beam-width 2 --no-promote --model-out data/models/ci-cem.json --replay-out data/replays/ci-cem.json
