name: Native Reachability Windows

on:
  push:
    branches: [perf-native-pathless-srs-20260905]

jobs:
  windows:
    if: github.event.head_commit.message == 'Verify native reachability on Windows'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - name: Verify native import
        run: uv run --no-sync python -c "from minoflux_ai.reachability_native import native_pathless_available; assert native_pathless_available(); print('native loaded')"
      - name: Differential smoke
        run: uv run --no-sync python -m pytest -q tests/test_reachability_native.py
