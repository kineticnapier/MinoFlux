name: Strength tournament

on:
  push:
    branches: [self-improve]
    paths:
      - 'src/minoflux_ai/heuristic.py'
      - 'tools/strength_tournament_b2b.py'
      - '.github/workflows/strength-tournament.yml'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python tools/strength_tournament_b2b.py
