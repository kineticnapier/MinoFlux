name: Strength tournament

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/strength_tournament.py'
      - '.github/workflows/strength-tournament.yml'
  workflow_dispatch:

jobs:
  versus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - t_proximity_preserve
          - clean_stack_flat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - name: Mirrored versus
        run: python tools/strength_tournament.py --candidate '${{ matrix.candidate }}' --seeds '6007,8089' --versus-turns 60 --out 'result-${{ matrix.candidate }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: versus-${{ matrix.candidate }}
          path: result-${{ matrix.candidate }}.json
