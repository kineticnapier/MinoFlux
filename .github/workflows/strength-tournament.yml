name: Strength tournament versus final

on:
  push:
    branches:
      - self-improve
    paths:
      - .github/workflows/strength-tournament.yml

jobs:
  versus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync package
        run: uv sync --extra dev
      - name: Run mirrored versus against baseline
        run: |
          uv run --no-sync python - <<'PY'
          from dataclasses import replace
          from minoflux_ai.heuristic import DEFAULT_WEIGHTS
          from minoflux_ai.versus_benchmark import run_versus_benchmark

          baseline = DEFAULT_WEIGHTS
          candidate = replace(DEFAULT_WEIGHTS, t_spin_slot_delta=0.25)
          r = run_versus_benchmark(
              games=8,
              max_turns=120,
              seed_base=86028121,
              seed_step=49979687,
              player_weights=candidate,
              ai_weights=baseline,
          )
          n = len(r.per_game)
          player_canceled = sum(g.player_canceled for g in r.per_game) / n
          ai_canceled = sum(g.ai_canceled for g in r.per_game) / n
          player_received = sum(g.player_received for g in r.per_game) / n
          ai_received = sum(g.ai_received for g in r.per_game) / n
          player_b2b = sum(g.player_max_b2b for g in r.per_game) / n
          ai_b2b = sum(g.ai_max_b2b for g in r.per_game) / n
          print(
              f"VERSUS candidate=slot-delta-025 games={r.games} wins={r.player_wins} "
              f"losses={r.ai_wins} draws={r.draws} candidate_attack={r.player_mean_attack:.3f} "
              f"baseline_attack={r.ai_mean_attack:.3f} candidate_sent={r.player_mean_sent:.3f} "
              f"baseline_sent={r.ai_mean_sent:.3f} candidate_canceled={player_canceled:.3f} "
              f"baseline_canceled={ai_canceled:.3f} candidate_received={player_received:.3f} "
              f"baseline_received={ai_received:.3f} candidate_max_b2b={player_b2b:.3f} "
              f"baseline_max_b2b={ai_b2b:.3f} mean_turns={r.mean_turns:.3f}"
          )
          for game in r.per_game:
              print("GAME", game)
          PY