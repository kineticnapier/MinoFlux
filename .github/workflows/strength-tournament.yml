name: Strength tournament

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_tournament.py'
      - '.github/workflows/strength-tournament.yml'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra game
      - name: Run tournament
        run: uv run python tools/self_improve_tournament.py
