name: Trajectory tournament

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_trajectory_tournament.py'
      - '.github/workflows/trajectory-tournament.yml'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install project
        run: uv sync --extra game
      - name: Run tournament
        run: uv run python tools/self_improve_trajectory_tournament.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-tournament-results
          path: tournament-results.json
          if-no-files-found: error
