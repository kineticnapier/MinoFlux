name: Apply versus policy aggregation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/versus-policy-aggregation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply benchmark CLI summary
        run: python tools/apply_versus_cli_summary.py
      - name: Commit generated CLI change
        run: |
          if git diff --quiet -- src/minoflux/versus_neural_cli.py; then
            echo 'CLI change already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/minoflux/versus_neural_cli.py
          git commit -m 'Clarify versus benchmark summary'
          git push origin HEAD:${{ github.head_ref }}
