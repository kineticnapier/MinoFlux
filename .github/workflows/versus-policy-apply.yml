name: Apply versus policy aggregation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/versus-policy-aggregation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply focused source changes
        run: python tools/apply_versus_policy_aggregation.py
      - name: Commit generated source changes
        run: |
          if git diff --quiet -- src/minoflux_ai/versus_benchmark.py src/minoflux_ai/versus_neural.py; then
            echo 'Source changes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/minoflux_ai/versus_benchmark.py src/minoflux_ai/versus_neural.py
          git commit -m 'Clarify versus policy aggregates'
          git push origin HEAD:${{ github.head_ref }}
