name: Diagnose test failure

on:
  push:
    branches: [self-improve]

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
      - run: uv sync --extra game --extra dev
      - run: uv run --no-sync python -m pytest -q tests/test_ai.py
  other-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
      - run: uv sync --extra game --extra dev
      - run: uv run --no-sync python -m pytest -q --ignore=tests/test_ai.py
