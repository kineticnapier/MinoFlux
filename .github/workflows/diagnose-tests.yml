name: Diagnose test failure

on:
  push:
    branches: [self-improve]

jobs:
  test-case:
    name: ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node:
          - tests/test_search_acceleration.py::BoundedRankingTests::test_limited_placement_ranking_matches_full_prefix
          - tests/test_search_acceleration.py::BoundedRankingTests::test_limited_hold_ranking_matches_full_prefix
          - tests/test_search_acceleration.py::BoundedRankingTests::test_discount_is_applied_to_future_score
          - tests/test_search_acceleration.py::PreviewCloneTests::test_preview_clone_matches_exact_stream_within_search_horizon
          - tests/test_search_acceleration.py::ParallelBenchmarkTests::test_parallel_and_serial_benchmarks_match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
      - run: uv sync --extra game --extra dev
      - run: uv run --no-sync python -m pytest -q ${{ matrix.node }}
