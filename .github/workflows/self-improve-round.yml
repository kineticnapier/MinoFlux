name: Self improve round

on:
  push:
    branches: [self-improve]
    paths:
      - '.github/workflows/self-improve-round.yml'
  workflow_dispatch:

jobs:
  fresh:
    name: fresh-${{ matrix.candidate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - t_arrival_accessible_conversion
          - hold_accessible_supply
          - b2b_accessible_reserve
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - name: Evaluate
        env:
          CANDIDATE: ${{ matrix.candidate }}
          STAGE: fresh
        run: uv run python tools/self_improve_round.py
