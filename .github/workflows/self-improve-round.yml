name: Self improve round

on:
  push:
    branches: [self-improve]
    paths:
      - tools/self_improve_round.py
      - .github/workflows/self-improve-round.yml
  workflow_dispatch:

jobs:
  versus:
    name: versus-${{ matrix.candidate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - clear_compaction
          - clear_depth_relief
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --extra game --extra dev
      - name: Run mirrored versus benchmark
        env:
          CANDIDATE: ${{ matrix.candidate }}
          STAGE: versus
        run: uv run --no-sync python tools/self_improve_round.py
