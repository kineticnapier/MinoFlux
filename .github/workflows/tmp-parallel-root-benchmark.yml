name: Temporary Root Parallel Benchmark

on:
  push:
    branches:
      - perf-parallel-root-srs-20260905

permissions:
  contents: write

jobs:
  benchmark:
    if: github.event.head_commit.message != 'Parallelize native root reachability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.13'
      - run: uv sync --extra ml --extra dev
      - name: Baseline Stage2 benchmark
        shell: bash
        run: |
          MINOFLUX_NATIVE_REACHABILITY_THREADS=1 uv run --no-sync python tools/_tmp_parallel_root_benchmark.py > /tmp/before.json || true
      - name: Apply parallel patch
        run: uv run --no-sync python tools/_tmp_patch_parallel_root.py
      - name: Rebuild native extension
        run: uv sync --extra ml --extra dev --reinstall-package minoflux
      - name: Differential workers 1
        env:
          MINOFLUX_NATIVE_REACHABILITY_THREADS: '1'
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_reachability_native.py
          tests/test_neural_native_record_path.py
          tests/test_neural_native_record_profile.py
          tests/test_neural_native_encoding.py
      - name: Differential workers 4
        env:
          MINOFLUX_NATIVE_REACHABILITY_THREADS: '4'
        run: >-
          uv run --no-sync python -m pytest -q
          tests/test_reachability_native.py
          tests/test_neural_native_record_path.py
          tests/test_neural_native_record_profile.py
          tests/test_neural_native_encoding.py
      - name: Worker scaling benchmark
        run: uv run --no-sync python tools/_tmp_parallel_root_benchmark.py > /tmp/after.json
      - name: Show benchmark
        shell: bash
        run: |
          cat /tmp/after.json
      - name: Full tests workers 4
        env:
          MINOFLUX_NATIVE_REACHABILITY_THREADS: '4'
        run: uv run --no-sync python -m pytest -q
      - name: Commit prototype sources
        shell: bash
        run: |
          git config user.name 'Kinetic Napier'
          git config user.email 'u61819269@gmail.com'
          git add src/minoflux_ai/_reachability_native.cpp src/minoflux_ai/neural_search_fast.py
          git commit -m 'Parallelize native root reachability'
          git push origin HEAD:perf-parallel-root-srs-20260905
