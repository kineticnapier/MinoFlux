name: Strength tournament classic features

on:
  push:
    branches: [self-improve]
    paths:
      - tools/strength_tournament_classic.py
      - .github/workflows/strength-tournament-classic.yml

jobs:
  versus:
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - row_transitions
          - eroded_cells
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python tools/strength_tournament_classic.py --phase versus --candidate "${{ matrix.candidate }}"
