name: Strength tournament contextual

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/strength_tournament_ctx.py'
      - '.github/workflows/strength-tournament-context.yml'
  workflow_dispatch:

jobs:
  fresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - slot_bump_quality
          - slot_depth_quality
          - slot_supply_match
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python tools/strength_tournament_ctx.py --phase fresh --candidate '${{ matrix.candidate }}'
