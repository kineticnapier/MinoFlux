name: Strength tournament contextual

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/strength_tournament_ctx.py'
      - '.github/workflows/strength-tournament-context.yml'
  workflow_dispatch:

jobs:
  versus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python tools/strength_tournament_ctx.py --phase versus --candidate slot_supply_match
