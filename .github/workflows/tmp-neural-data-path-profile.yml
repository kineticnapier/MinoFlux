name: Temporary Neural Data Path Profile

on:
  push:
    branches:
      - perf-neural-data-path-20260905

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: '3.13'
      - run: uv sync --extra ml --extra dev
      - run: uv run --no-sync python tools/_tmp_neural_path_profile.py
