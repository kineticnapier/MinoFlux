name: Self-improve garbage tournament

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_garbage_tournament.py'
      - '.github/workflows/self-improve-garbage-tournament.yml'
  workflow_dispatch:

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync
        run: uv sync --extra dev
      - name: Run tournament
        run: uv run python tools/self_improve_garbage_tournament.py tournament-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: self-improve-garbage-tournament
          path: tournament-result.json
