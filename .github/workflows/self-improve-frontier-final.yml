name: Self improve frontier final

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_frontier_final.py'
      - '.github/workflows/self-improve-frontier-final.yml'

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Run mirrored versus final
        working-directory: tools
        run: uv run python self_improve_frontier_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: self-improve-frontier-final-result
          path: tools/tournament-final.json
