name: Temporary Neural Search Phase2

on:
  push:
    branches:
      - test/neural-search-phase2-20260907

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev --extra ml
      - name: Focused native tests
        run: uv run --no-sync python -m pytest -q tests/test_neural_native_record_path.py tests/test_neural_native_record_profile.py tests/test_neural_native_encoding.py
      - name: Old versus optimized exact benchmark
        run: uv run --no-sync python tools/_tmp_neural_search_phase2_benchmark.py
