name: Self improve fast screen

on:
  push:
    branches: [self-improve]
    paths:
      - '.github/workflows/self-improve-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  STAGE: short

jobs:
  candidate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - pressure_clean_exit
          - pressure_hole_relief
          - pressure_depth_relief
          - pressure_height_relief
          - pressure_surface_relief
          - pressure_damage_cost
          - spin_clean_exit
          - b2b_clean_pressure
          - danger_pressure_recovery
          - pressure_slot_preserve
          - pressure_slot_create
          - tspin_slot_exit
          - downstack_pressure_exit
          - pressure_consistency
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - name: Evaluate
        env:
          CANDIDATES: ${{ matrix.candidate }}
        run: |
          uv run python tools/self_improve_round.py
          mv self-improve-results.json result-${{ matrix.candidate }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.candidate }}
          path: result-${{ matrix.candidate }}.json

  collect:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: self-improve
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: collected
          merge-multiple: true
      - name: Merge results
        run: |
          python - <<'PY'
          import glob,json
          out=[]
          for p in sorted(glob.glob('collected/result-*.json')):
              with open(p,encoding='utf-8') as f:
                  out.extend(json.load(f)['results'])
          with open('self-improve-fast-results.json','w',encoding='utf-8') as f:
              json.dump({'stage':'short','results':out},f,indent=2)
          PY
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add self-improve-fast-results.json
          git commit -m 'Record parallel pressure-quality screen' || exit 0
          git push origin HEAD:self-improve
