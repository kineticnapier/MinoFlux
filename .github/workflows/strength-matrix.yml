name: Strength matrix

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_matrix.py'
      - '.github/workflows/strength-matrix.yml'

jobs:
  fresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - t_near_slot_surface_stability
          - t_near_slot_depth_quality
          - pending_height_emergency
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra game
      - run: uv run python tools/self_improve_matrix.py fresh '${{ matrix.candidate }}'
