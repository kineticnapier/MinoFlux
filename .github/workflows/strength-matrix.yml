name: Strength matrix

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_matrix.py'
      - '.github/workflows/strength-matrix.yml'

jobs:
  fresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate:
          - baseline
          - t_window_reserve
          - t_supply_safety_margin
          - slot_survival_margin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra game
      - run: uv run python tools/self_improve_matrix.py fresh '${{ matrix.candidate }}'
