name: Strength matrix

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_matrix.py'
      - '.github/workflows/strength-matrix.yml'

jobs:
  fresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - danger_new_hole_product
          - b2b_attack_conversion
          - clean_attack_followthrough
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra game
      - run: uv run python tools/self_improve_matrix.py fresh '${{ matrix.candidate }}'
