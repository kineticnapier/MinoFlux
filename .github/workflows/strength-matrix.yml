name: Strength matrix

on:
  push:
    branches: [self-improve]
    paths:
      - 'tools/self_improve_matrix.py'
      - '.github/workflows/strength-matrix.yml'

jobs:
  short:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - baseline
          - slot_hole_depth_quality
          - slot_bumpiness_quality
          - slot_height_bumpiness_joint
          - t_near_slot_depth_quality
          - t_near_slot_surface_stability
          - attack_clean_ratio
          - spin_clean_ratio
          - difficult_clear_clean_exit
          - low_slot_after_attack
          - downstack_spin_synergy
          - pending_height_emergency
          - pressure_finish
          - cancel_survival
          - garbage_clean_response
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra game
      - run: uv run python tools/self_improve_matrix.py short '${{ matrix.candidate }}'
