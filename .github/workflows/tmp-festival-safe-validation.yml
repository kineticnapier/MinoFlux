name: Temporary Festival Safe Validation

on:
  push:
    branches:
      - test/festival-safe-validation-20260906

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Focused tests
        run: uv run --no-sync python -m pytest -q tests/test_festival_safe.py
      - name: Tune benchmark
        run: uv run --no-sync python tools/_tmp_festival_tune.py
