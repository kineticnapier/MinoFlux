name: Temporary Festival Safe Validation

on:
  push:
    branches:
      - test/festival-safe-validation-20260906

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --extra game --extra dev --extra ml
      - name: Focused festival-safe tests
        run: uv run --no-sync python -m pytest -q tests/test_festival_safe.py
      - name: Full test suite
        run: uv run --no-sync python -m pytest -q
      - name: Verify CLI preset parsing
        run: uv run --no-sync python -c "from minoflux.versus_ai import build_parser; a=build_parser().parse_args(['--ai-model','festival-safe']); assert a.ai_model == 'festival-safe'; print(a.ai_model)"
      - name: Smoke and benchmarks
        run: uv run --no-sync python tools/_tmp_festival_safe_validation.py
